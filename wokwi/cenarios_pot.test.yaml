name: 'VoltGuard - alerta preventivo pelo potenciometro'
version: 1
author: 'Projeto VoltGuard'

# Potenciometro em 0,6 = 9 A simulados, acima do limite padrao de 8 A.
steps:
  - wait-serial: 'VoltGuard Rev. B'
  - delay: 3000ms
  - set-control:
      part-id: pot1
      control: position
      value: 0.6
  - wait-serial: 'MUDANCA DE ESTADO: ALERTA PREVENTIVO'
  - set-control:
      part-id: pot1
      control: position
      value: 0
  - wait-serial: 'MUDANCA DE ESTADO: NORMAL'
